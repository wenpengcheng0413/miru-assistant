# ============================================================
# Miru Chat Analyzer — 联系人白名单模板
# ============================================================
# 复制本文件为 contacts.yaml 并填入你的联系人:
#   cp config/contacts.example.yaml config/contacts.yaml
#
# 字段说明:
#   name:     显示名（必填，用于输出目录名）
#   username: 微信号或微信 ID（推荐填，最可靠）
#   remark:   微信备注名（可选）
#
# 匹配优先级: username > name > remark
# 提供任意一项即可命中；三项都填最保险。
# ============================================================

contacts:
  - name: "示例联系人"
    username: "example_wxid"
    remark: "备注名"
