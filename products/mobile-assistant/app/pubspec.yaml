name: miru_app
description: Miru 语音 AI 助手客户端（iPhone 语音入口）
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  record: 6.2.1
  audioplayers: 6.7.1
  dio: ^5.4.3
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.0.0
  # 7.1.5 起其 Android 平台包要求 Dart 3.12；Codemagic 的 Flutter
  # 3.41.7 使用 Dart 3.11，因此必须固定到最后一个兼容版本。
  bonsoir: 7.1.4
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.6

# record 固定 6.2.1：7.x 需要 Dart 3.12+（CI 固定 Flutter 3.41.7 = Dart 3.11）；
# 6.2.1 的平台包集合（record_linux 1.3.1 / record_ios 1.2.1 等）互相兼容，无需 override。
# 勿降回 5.x：5.x + platform_interface ≥1.3.0 会编译失败（startStream 变为抽象方法），
# 而 5.x 的其他平台包又要求 ≥1.5.0，pub 上已无一致解。
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# audioplayers_darwin 6.4.0+ 的异步 Swift 播放实现在 iOS 短 MP3 上可能
# 挂起首个 play()；6.3.0 位于该回归之前。真机验证通过前保持精确固定。
dependency_overrides:
  audioplayers_darwin: 6.3.0

flutter:
  uses-material-design: true
