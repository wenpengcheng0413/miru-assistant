# ============================================================
# Miru Assistant — 主配置文件
# ============================================================
# 敏感信息（API Key / Token）通过环境变量注入，不要写在这里。
# 支持的语法：${ENV_VAR_NAME} 或 ${ENV_VAR_NAME:default_value}
#
# 首次使用：复制本文件为 settings.yaml 并修改
#   cp config/settings.example.yaml config/settings.yaml
# ============================================================

miru:
  # ----------------------------------------------------------
  # 关注的微信群
  # ----------------------------------------------------------
  # 填写你在微信中看到的群聊名称（支持模糊匹配）
  groups:
    - "21级环境工程班群"
    - "环境工程课程群"
    - "实验课群"
    - "AI交流群"
    - "ComfyUI交流群"

  # ----------------------------------------------------------
  # 定时调度
  # ----------------------------------------------------------
  scheduler:
    daily_report_time: "21:00"        # 每天几点执行日报 (24h)
    timezone: "Asia/Shanghai"
    # 错过补偿：如果电脑在触发时间关机，开机后是否补执行
    misfire_grace_time: 1800           # 秒 (30分钟)

  # ----------------------------------------------------------
  # LLM 配置 (DeepSeek)
  # ----------------------------------------------------------
  llm:
    provider: "deepseek"               # 目前仅支持 deepseek
    api_key: "${MIRU_DEEPSEEK_API_KEY}" # 环境变量 —— 不要硬编码！
    base_url: "https://api.deepseek.com"
    model: "deepseek-v4-flash"
    temperature: 0.3
    max_tokens: 2048
    timeout: 60                        # API 超时 (秒)
    max_retries: 2
    retry_delay: [5, 30]              # 重试间隔 (秒)

  # ----------------------------------------------------------
  # 消息推送
  # ----------------------------------------------------------
  notifiers:
    - type: "pushplus"
      enabled: true
      token: "${MIRU_PUSHPLUS_TOKEN}"  # 环境变量 —— 不要硬编码！
    - type: "console"
      enabled: true                     # 同时输出到控制台（调试用）

  # ----------------------------------------------------------
  # 数据存储
  # ----------------------------------------------------------
  storage:
    db_path: "./data/miru.db"
    log_path: "./data/logs"
    log_level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
    log_retention: "30 days"           # 日志保留时间
    log_rotation: "10 MB"             # 单个日志文件最大大小

  # ----------------------------------------------------------
  # 微信客户端
  # ----------------------------------------------------------
  wechat:
    # 微信数据目录（留空 = 自动检测）
    # 微信 4.x: C:/Users/<用户名>/Documents/xwechat_files/<wxid>/
    # 微信 3.x: C:/Users/<用户名>/Documents/WeChat Files/<wxid>/
    data_dir: ""
    # 手动提供数据库密钥 (64 hex字符) —— 设置后跳过自动内存扫描
    # 可通过 wx_key / chatlog_alpha 等 DLL Hook 工具获取
    database_key: ""
    # 当前经过测试的微信版本
    tested_version: "4.0.x"
    # 版本不匹配时的行为: warn | error | skip
    on_version_mismatch: "warn"
