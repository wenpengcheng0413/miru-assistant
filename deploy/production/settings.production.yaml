profile: cloud

server:
  host: 0.0.0.0
  port: 8765
  token: "${MIRU_SERVER_TOKEN}"
  advertise_lan: false
  cors_origins: []

llm:
  base_url: https://api.deepseek.com
  api_key: "${MIRU_DEEPSEEK_API_KEY}"
  model: deepseek-v4-flash
  vision_model: deepseek-v4-flash
  thinking: false
  temperature: 0.7
  max_tokens: 32768
  short_max_tokens: 2048
  timeout_s: 90
  max_tool_rounds: 6

stt:
  # Tencent postpay is disabled in the console. The explicit guard below is a
  # second operational gate; Home Node SenseVoice remains the zero-cost fallback.
  engine: tencent
  tencent:
    endpoint: https://asr.tencentcloudapi.com
    secret_id: "${MIRU_TENCENT_ASR_SECRET_ID}"
    secret_key: "${MIRU_TENCENT_ASR_SECRET_KEY}"
    engine_model: 16k_zh-PY
    timeout_s: 30
    billing_guard: "${MIRU_TENCENT_ASR_BILLING_GUARD}"

tts:
  # No API key or billing account. This is the Microsoft Edge online voice,
  # so a provider outage degrades to text without blocking the conversation.
  provider: edge
  format: mp3
  sample_rate: 24000
  fallback_to_edge: false
  edge:
    voice: zh-CN-XiaoxiaoNeural
    timeout_s: 20

memory:
  auto_extract: true
  history_max_chars: 16000
  episodes_max_in_prompt: 5
  summarize_at_rounds: 20

persona:
  default: miru
  dir: ./config/persona

tools:
  enabled:
    - get_current_time
    - memory_set
    - memory_get
    - memory_list
    - memory_delete
    - memory_search
    - api_cost_report
    - api_budget_set
    - home_node_ping
    - wechat_conversation_messages
    - wechat_original_images
    - wechat_search_messages
    - wechat_transcribe_voice

db:
  path: ./data/miru_server.db

backup:
  enabled: false
  dir: ./data/backups
  retention_days: 7

attachments:
  dir: ./data/attachments
  max_file_mb: 10
  max_images_per_turn: 4
  max_preview_pages: 4
  max_extracted_chars_per_turn: 20000

home_node:
  enabled: true
  node_id: node-home
  token: "${MIRU_HOME_NODE_TOKEN}"
  allowed_capabilities:
    - home_node_ping
    - speech_to_text
    - wechat_conversation_messages
    - wechat_original_images
    - wechat_search_messages
    - wechat_transcribe_voice
  heartbeat_interval_s: 20
  stale_after_s: 30
  offline_after_s: 60
