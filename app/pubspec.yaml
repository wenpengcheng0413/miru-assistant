name: miru_app
description: Miru 语音 AI 助手客户端（iPhone 语音入口）
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  record: 6.2.1
  audioplayers: ^6.1.0
  dio: ^5.4.3
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.0.0
  cupertino_icons: ^1.0.6

# record 固定 6.2.1：7.x 需要 Dart 3.12+（CI 固定 Flutter 3.41.7 = Dart 3.11）；
# 6.2.1 的平台包集合（record_linux 1.3.1 / record_ios 1.2.1 等）互相兼容，无需 override。
# 勿降回 5.x：5.x + platform_interface ≥1.3.0 会编译失败（startStream 变为抽象方法），
# 而 5.x 的其他平台包又要求 ≥1.5.0，pub 上已无一致解。
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
