[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miru-server"
version = "0.1.0"
description = "Miru 语音 AI 工作台后端（FastAPI + DeepSeek + 本地 STT + 流式 TTS）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "sqlalchemy>=2.0",
    "openai>=1.40",
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "Pillow>=10",
    "zeroconf>=0.150,<0.151",
]

[project.optional-dependencies]
stt = ["sherpa-onnx>=1.10", "numpy"]
tts-fallback = ["edge-tts>=7.2.8,<8"]
debug-voice = ["sounddevice>=0.4"]
document = ["PyMuPDF>=1.24", "openpyxl>=3.1", "python-docx>=1.1", "python-pptx>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
miru-server = "miru_server.main:run"
miru-home-node = "miru_node.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["miru_server*", "miru_node*"]
