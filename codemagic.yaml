# Miru iOS 客户端构建（复刻 cashew-budget-mobile-app 的已验证配方）
# Codemagic 云端 Mac 构建 unsigned IPA → 下载后导入 LiveContainer
# 触发：push 到 master 或打 ios-v* 标签
workflows:
  miru-ios-build:
    name: Miru iOS Sideload IPA Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: products/mobile-assistant/app
    environment:
      groups:
        - miru-production
      # 固定 3.41.7：机器上存在多套 SDK（3.47 的 podhelper 布局已变），
      # 必须保证 pub get 与 xcodebuild 用同一套，否则 Dart 语言版本冲突（language 3.12 too high）
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
      # MIRU_BASE_URL 在 Codemagic UI 中配置为非 Secret 环境变量。
      # App Token 永远不进入构建环境或 IPA，仍由用户写入 iOS Keychain。
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: master
          include: true
      tag_patterns:
        - pattern: ios-v*
          include: true
    scripts:
      # 客户端目录只有 pubspec + lib（无 ios/ 平台壳）：在 /tmp 生成后只拷 ios/ 进来，
      # 避免 flutter create . 覆盖我们的 README 等文件
      - name: Generate iOS platform shell
        script: |
          flutter create --platforms=ios --project-name miru_app --org com.miru /tmp/miru_shell
          rm -rf ios
          cp -R /tmp/miru_shell/ios ios
          rm -rf /tmp/miru_shell
          ls -la ios/
      # 生产 App 只请求真实需要的权限。Tailnet 使用 HTTPS/WSS，不需要 Bonjour、
      # Local Network 权限或 ATS 任意明文放行。
      - name: Patch Info.plist permissions
        script: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Miru 需要麦克风来听你说话'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Miru 需要相机来拍摄并分析图片'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Miru 需要访问照片以分析你选择的图片'" "$PLIST"
          cat "$PLIST"
      # unsigned 设备构建必须显式禁用签名（否则报 "requires a selected Development Team"）
      - name: Disable code signing
        script: |
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Debug.xcconfig
          cat ios/Flutter/Release.xcconfig
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Run Flutter tests
        script: flutter test
      - name: Update CocoaPods specs repo
        script: pod repo update || true
      # 连 flutter build ios --config-only 都会做签名证书校验 → 完全绕开 flutter 工具：
      # 手动生成 Generated.xcconfig + pod install + 直接 xcodebuild（命令行为 unsigned 显式开关）
      - name: Generate Xcode config manually
        script: |
          if [ -z "$MIRU_BASE_URL" ]; then
            echo "ERROR: MIRU_BASE_URL is required for the production Tailnet build"
            exit 1
          fi
          case "$MIRU_BASE_URL" in
            https://*) ;;
            *) echo "ERROR: MIRU_BASE_URL must use HTTPS"; exit 1 ;;
          esac
          echo "=== 诊断：flutter 安装情况 ==="
          which flutter
          flutter --version
          echo "=== 搜索 podhelper 真实位置（须与 PATH 上的 flutter 是同一 SDK）==="
          PODHELPER=$(find /usr/local /opt "$HOME" -name "podhelper*" 2>/dev/null | head -1)
          echo "PODHELPER=$PODHELPER"
          if [ -z "$PODHELPER" ]; then
            echo "ERROR: 未找到 podhelper*，打印全部候选"
            find / -name "podhelper*" 2>/dev/null | head -10
            exit 1
          fi
          # 反向推导 SDK 根：podhelper 前面的 /packages/flutter_tools 之前就是 SDK 根
          FLUTTER_ROOT=$(python3 -c "
          import sys
          p = '$PODHELPER'
          idx = p.find('/packages/flutter_tools')
          if idx < 0:
              idx = p.find('/flutter_tools')
          print(p[:idx] if idx > 0 else 'UNKNOWN')")
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          DART_DEFINES=$(python3 -c "import base64,os; values=['MIRU_DEPLOYMENT_PROFILE=tailnet','MIRU_BASE_URL='+os.environ['MIRU_BASE_URL'].rstrip('/')]; print(','.join(base64.b64encode(v.encode()).decode() for v in values))")
          cat > ios/Flutter/Generated.xcconfig << EOF
          FLUTTER_ROOT=$FLUTTER_ROOT
          FLUTTER_APPLICATION_PATH=$PWD
          COCOAPODS_PARALLEL_CODE_SIGN=true
          FLUTTER_BUILD_DIR=build
          FLUTTER_BUILD_NAME=0.3.2
          FLUTTER_BUILD_NUMBER=5
          DART_DEFINES=$DART_DEFINES
          PACKAGE_CONFIG=$PWD/.dart_tool/package_config.json
          EOF
          grep -v '^DART_DEFINES=' ios/Flutter/Generated.xcconfig
      - name: Pod install
        script: cd ios && pod install
      - name: Build app bundle (xcodebuild, unsigned)
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA (Payload/ditto)
        script: |
          APP_PATH=$(find build -name "Runner.app" -path "*Release-iphoneos*" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "ERROR: Runner.app not found"; exit 1; fi
          mkdir -p build/ios/ipa
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --keepParent Payload build/ios/ipa/Miru.ipa
          rm -rf Payload
          ls -la build/ios/ipa/
    artifacts:
      - build/ios/ipa/Miru.ipa
